name: Android CI - Build & Test

# Runs on every push and pull request against main, so bugs are caught
# before merging (see README "GitHub Actions" section).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Uses Gradle directly (not ./gradlew) so the workflow does not depend
      # on the binary gradle-wrapper.jar being committed. Android Studio
      # generates gradlew/gradlew.bat/gradle-wrapper.jar automatically the
      # first time the project is opened - commit those once you have them
      # and this job will keep working either way.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x ./gradlew || true

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetqueue-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
